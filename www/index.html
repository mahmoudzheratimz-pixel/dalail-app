<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8a6a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>دلائل الخيرات</title>
<style>
:root{--bg:#f6efdc;--gold:#8a6a2f;--ink:#3a2c12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2314;overflow:hidden;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}
#stage{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;padding-top:env(safe-area-inset-top)}
#pg{position:relative;aspect-ratio:396.85/566.929;max-width:100%;max-height:100%;height:100%;transform-origin:center;will-change:transform;background:var(--bg)}
#pg img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hs{position:absolute;border-radius:10px;cursor:pointer}
.hs:active{background:rgba(138,106,47,.28)}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--gold);display:flex;align-items:center;justify-content:space-between;padding-inline:8px;color:#fff;gap:6px}
#bar button{background:rgba(255,255,255,.16);border:0;color:#fff;font:600 15px inherit;font-family:inherit;border-radius:10px;height:40px;min-width:44px;padding:0 12px}
#bar button:active{background:rgba(255,255,255,.35)}
#bar button:disabled{opacity:.35}
#num{display:flex;align-items:center;gap:4px;font-size:15px}
#num input{width:54px;height:36px;text-align:center;border:0;border-radius:8px;font-size:16px;background:#fff;color:var(--ink)}
</style>
</head>
<body>
<div id="stage"><div id="pg"><img id="im" alt=""></div></div>
<div id="bar">
  <button id="next" aria-label="التالي">‹ التالي</button>
  <div id="num"><input id="inp" type="number" inputmode="numeric" min="1"> <span id="tot"></span></div>
  <button id="home">☰ الفهرس</button>
  <button id="prev" aria-label="السابق">السابق ›</button>
</div>
<script src="hotspots.js"></script>
<script>
const T=window.TOTAL,H=window.HOTSPOTS;
const pg=document.getElementById('pg'),im=document.getElementById('im'),inp=document.getElementById('inp');
let cur=1,scale=1,tx=0,ty=0;
document.getElementById('tot').textContent='/ '+T;
const pad=n=>String(n).padStart(3,'0');
function applyT(){pg.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function go(n,push=true){
  n=Math.max(1,Math.min(T,n));cur=n;
  scale=1;tx=ty=0;applyT();
  im.src=`pages/p-${pad(n)}.jpg`;
  pg.querySelectorAll('.hs').forEach(e=>e.remove());
  (H[n]||[]).forEach(h=>{
    const a=document.createElement('div');a.className='hs';
    a.style.cssText=`left:${h.l}%;top:${h.t}%;width:${h.w}%;height:${h.h}%`;
    a.addEventListener('click',()=>go(h.to));
    pg.appendChild(a);
  });
  inp.value=n;
  document.getElementById('prev').disabled=n<=1;
  document.getElementById('next').disabled=n>=T;
  try{localStorage.setItem('dalail-page',n)}catch(e){}
  [n+1,n-1].forEach(m=>{if(m>=1&&m<=T)new Image().src=`pages/p-${pad(m)}.jpg`});
}
document.getElementById('home').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
inp.addEventListener('change',()=>go(parseInt(inp.value)||cur));
inp.addEventListener('focus',()=>inp.select());
// touch: swipe (RTL: swipe right => next page), pinch zoom, pan when zoomed, double tap
const st=document.getElementById('stage');
let t0=null,pinch=null,lastTap=0;
const dist=e=>Math.hypot(e[0].clientX-e[1].clientX,e[0].clientY-e[1].clientY);
st.addEventListener('touchstart',e=>{
  if(e.touches.length===2){pinch={d:dist(e.touches),s:scale};t0=null}
  else if(e.touches.length===1){t0={x:e.touches[0].clientX,y:e.touches[0].clientY,tx,ty,t:Date.now(),moved:false}}
},{passive:true});
st.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){scale=Math.max(1,Math.min(4,pinch.s*dist(e.touches)/pinch.d));if(scale===1){tx=ty=0}applyT()}
  else if(t0&&e.touches.length===1){
    const dx=e.touches[0].clientX-t0.x,dy=e.touches[0].clientY-t0.y;
    if(Math.abs(dx)+Math.abs(dy)>8)t0.moved=true;
    if(scale>1){tx=t0.tx+dx;ty=t0.ty+dy;applyT()}
  }
},{passive:true});
st.addEventListener('touchend',e=>{
  if(pinch){if(e.touches.length<2)pinch=null;return}
  if(!t0)return;
  const c=e.changedTouches[0],dx=c.clientX-t0.x,dy=c.clientY-t0.y;
  if(scale===1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx>0?cur+1:cur-1)}
  else if(!t0.moved&&Date.now()-lastTap<300){scale=scale>1?1:2.2;tx=ty=0;applyT();lastTap=0}
  else if(!t0.moved){lastTap=Date.now()}
  t0=null;
});
// desktop: arrow keys
addEventListener('keydown',e=>{if(e.target===inp)return;if(e.key==='ArrowLeft')go(cur+1);if(e.key==='ArrowRight')go(cur-1)});
let start=1;try{start=parseInt(localStorage.getItem('dalail-page'))||1}catch(e){}
go(start);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
